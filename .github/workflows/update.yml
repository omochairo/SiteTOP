name: 記事の自動更新

# 週 1 回（月曜 6:00 JST）と毎月 1 日（10:00 JST）に omcha.jp の記事を取り直して commit する。
# commit されると Netlify が作り直すので、「今月・来月」と「あと何日」も更新される。
on:
  schedule:
    - cron: '0 21 * * 0'
    - cron: '0 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run fetch
      - run: npm run build
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "記事データを更新（$(TZ=Asia/Tokyo date +%F)）"
          git push
